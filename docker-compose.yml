services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eduhub-network

  web:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-eduhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ENABLE_POPULATE_DB: ${ENABLE_POPULATE_DB:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # issuer/audience Better Auth puts in its JWTs, and where to fetch its public keys inside the network
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      BETTER_AUTH_JWKS_URL: http://frontend:5173/api/auth/jwks
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      # uvicorn --reload: Docker on Windows/macOS doesn't pass file events through bind mounts
      WATCHFILES_FORCE_POLLING: "true"
    # writes uploads into the mounted folder, so run as its owner (Linux hosts and CI)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eduhub-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      target: dev
      dockerfile: Dockerfile
    # next dev writes next-env.d.ts into the mounted folder, so run as the user who owns it (Linux hosts and CI)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
      # Better Auth: sessions and users in the shared Postgres (own "auth" schema)
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required (openssl rand -base64 32)}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-eduhub}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    # fresh build cache on every start: a cache kept across container recreation goes stale and breaks Turbopack
    tmpfs:
      - /app/.next:mode=1777
    ports:
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - eduhub-network

volumes:
  pgdata:
  frontend_node_modules:

networks:
  eduhub-network:
    driver: bridge
