name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password_default
  POSTGRES_DB: eduhub
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        working-directory: ./Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests (pytest, applies the Alembic migrations to a fresh test database)
        working-directory: ./Backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: pytest -v

      - name: Check backend code style (flake8)
        working-directory: ./Backend
        run: flake8 . --count --statistics

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./Frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: ./Frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: ./Frontend
        run: npm run test:unit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./Frontend
        env:
          BETTER_AUTH_SECRET: build-time-placeholder
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/.next
          retention-days: 1

  docker-backend-build:
    name: Docker Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          load: true
          tags: eduhub-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend Docker image
        run: |
          docker run --rm --entrypoint python eduhub-backend:test --version
          docker run --rm --entrypoint pip eduhub-backend:test list | grep -i fastapi

  docker-frontend-build:
    name: Docker Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          target: dev
          push: false
          load: true
          tags: eduhub-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend Docker image
        run: |
          docker run --rm eduhub-frontend:test node --version
          docker run --rm eduhub-frontend:test npm --version

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for testing
        run: |
          echo "POSTGRES_USER=${{ env.POSTGRES_USER }}" > .env
          echo "POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ env.POSTGRES_DB }}" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1,web" >> .env
          echo "CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173" >> .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .env
          echo "HOST_GID=$(id -g)" >> .env

      - name: Build Docker Compose services
        run: |
          docker compose build --parallel

      - name: Start services
        run: |
          docker compose up -d db mailpit web frontend

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -U postgres; do sleep 2; done'
          echo "Waiting for backend application to respond..."
          timeout 120 bash -c 'until docker compose exec -T web curl -fsS http://localhost:8000/api/health/ >/dev/null; do docker compose logs web --tail=20; sleep 3; done'
          echo "Waiting for frontend to be ready..."
          timeout 120 bash -c 'until curl -fsS http://localhost:5173/ >/dev/null; do docker compose logs frontend --tail=20; sleep 3; done'

      - name: Check service health
        if: ${{ always() }}
        run: |
          docker compose ps
          docker compose logs web --tail=50
          docker compose logs frontend --tail=50

      - name: Test backend health endpoint
        run: |
          echo "Testing backend endpoints..."
          docker compose exec -T web curl -fsS http://localhost:8000/api/health/
          docker compose exec -T web curl -fsS http://localhost:8000/api/courses/
          echo "Checking the database is at the latest migration..."
          docker compose exec -T web alembic check
          echo "Verifying frontend is running..."
          curl -fsS http://localhost:5173/

      - name: Set up Python for the end-to-end test
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: End-to-end test (Better Auth sign-up/login, API tokens, courses, uploads)
        working-directory: ./Backend
        env:
          E2E_FRONTEND_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000
        run: |
          pip install -r requirements-dev.txt
          pytest e2e -v

      - name: Set up Node.js for the browser tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Browser tests (Playwright, as author and learner)
        working-directory: ./Frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_MAILPIT_URL: http://localhost:8025
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 7

      - name: Stop services
        if: ${{ always() }}
        run: |
          docker compose down -v

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend packages that ship (high and critical fail the build)
        working-directory: ./Frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit backend packages
        run: |
          pip install pip-audit
          pip-audit -r Backend/requirements.txt

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on Dockerfiles
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() }}
        with:
          sarif_file: 'trivy-results.sarif'

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for large files
        run: |
          find . -type f -size +5M ! -path "./.git/*" ! -path "./node_modules/*" ! -path "./venv/*" ! -path "./.venv/*" | head -20

      - name: Check for secrets
        run: |
          if grep -r "password.*=.*['\"].*[a-zA-Z0-9]\{8,\}" Backend/ \
            --include="*.py" \
            --exclude-dir="migrations" | \
            grep -v "test" | \
            grep -v "password_default"; then
            echo "Potential hardcoded passwords found"
            exit 1
          fi

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint, frontend-build, docker-backend-build, docker-frontend-build, docker-compose-test, dependency-audit]
    if: ${{ always() }}

    steps:
      - name: Check job status
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Backend Build | ${{ needs.docker-backend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Frontend Build | ${{ needs.docker-frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Compose Test | ${{ needs.docker-compose-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
